<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Builder — Jay Mahakali Earth Movers</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0c0e16;
  --surface:   #141720;
  --surface2:  #1c2030;
  --border:    #252a3a;
  --border2:   #303550;
  --accent:    #3d7df5;
  --accent2:   #5a95ff;
  --text:      #dde2f0;
  --muted:     #5d667e;
  --input-bg:  #0e111a;
  --success:   #22c55e;
  --danger:    #ef4444;
  --warn:      #f59e0b;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── TOP BAR ─────────────────────────────────────── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 12px;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), #6b48ff);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.topbar-title { font-size: 14px; font-weight: 700; color: var(--text); }
.topbar-sub { font-size: 11px; color: var(--muted); }
.btn-group { display: flex; gap: 8px; }
.btn {
  padding: 8px 14px;
  border-radius: 7px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  letter-spacing: 0.3px;
}
.btn-pdf  { background: #dc2626; color: #fff; }
.btn-pdf:hover  { background: #b91c1c; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(220,38,38,0.4); }
.btn-excel{ background: #16a34a; color: #fff; }
.btn-excel:hover{ background: #15803d; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(22,163,74,0.4); }
.btn-print{ background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
.btn-print:hover{ background: var(--border); }

/* ─── MAIN LAYOUT ─────────────────────────────────── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ─── EDITOR PANEL ────────────────────────────────── */
.editor {
  width: 360px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.editor::-webkit-scrollbar { width: 5px; }
.editor::-webkit-scrollbar-track { background: transparent; }
.editor::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.section {
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
}
.section-header {
  padding: 9px 12px;
  background: var(--surface2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent2);
  user-select: none;
  transition: background 0.15s;
}
.section-header:hover { background: var(--border); }
.section-arrow { font-size: 10px; transition: transform 0.2s; }
.section-arrow.open { transform: rotate(90deg); }
.section-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px solid var(--border);
}

.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 600;
}
.field input, .field select, .field textarea {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 9px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  transition: border-color 0.15s;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: #0f1520;
}
.field textarea { resize: vertical; min-height: 52px; }
.field select { appearance: auto; }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

/* Items */
.item-card {
  background: var(--input-bg);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  position: relative;
}
.item-card-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
}
.btn-rm {
  background: rgba(239,68,68,0.15);
  color: var(--danger);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 5px;
  padding: 2px 8px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 600;
}
.btn-rm:hover { background: rgba(239,68,68,0.3); }
.btn-add-item {
  background: transparent;
  border: 1.5px dashed var(--border2);
  color: var(--accent2);
  border-radius: 7px;
  padding: 8px;
  width: 100%;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.15s;
}
.btn-add-item:hover { border-color: var(--accent); background: rgba(61,125,245,0.06); }

/* Live totals strip */
.totals-strip {
  background: var(--input-bg);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.totals-strip .t-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
}
.totals-strip .t-row.final {
  color: var(--text);
  font-weight: 700;
  font-size: 13px;
  border-top: 1px solid var(--border2);
  padding-top: 6px;
  margin-top: 2px;
}
.totals-strip .t-row.balance {
  color: var(--warn);
  font-weight: 700;
}

/* ─── PREVIEW PANEL ───────────────────────────────── */
.preview-panel {
  flex: 1;
  overflow-y: auto;
  background: #c8cdd8;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
}
.preview-panel::-webkit-scrollbar { width: 8px; }
.preview-panel::-webkit-scrollbar-track { background: #b0b5c0; }
.preview-panel::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }

/* ═══════════════════════════════════════════════════
   INVOICE STYLES
═══════════════════════════════════════════════════ */
.invoice {
  background: #fff;
  width: 750px;
  min-height: 1060px;
  padding: 14px 16px 16px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 10.5px;
  color: #000;
  box-shadow: 0 4px 32px rgba(0,0,0,0.35);
  border-radius: 1px;
  line-height: 1.4;
}

.inv-thankyou {
  text-align: center;
  font-size: 9.5px;
  color: #555;
  margin-bottom: 5px;
  font-style: italic;
}

/* Header */
.inv-header-wrap {
  border: 1px solid #000;
}
.inv-header-top {
  display: grid;
  grid-template-columns: 55% 45%;
  border-bottom: 1px solid #000;
}
.inv-seller {
  padding: 8px 10px;
  border-right: 1px solid #000;
}
.inv-seller-name {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 3px;
  line-height: 1.2;
}
.inv-seller-addr { font-size: 9px; color: #333; margin-bottom: 1px; }
.inv-seller-phone { font-size: 9px; margin-bottom: 3px; }
.inv-seller-meta { font-size: 9px; margin-top: 3px; }

.inv-details { padding: 8px 10px; }
.inv-details-title {
  font-weight: bold;
  font-size: 10px;
  margin-bottom: 5px;
  text-align: center;
  text-decoration: underline;
}
.inv-dtable { width: 100%; font-size: 9.5px; border-collapse: collapse; }
.inv-dtable tr td { padding: 2px 3px; vertical-align: top; }
.inv-dtable tr td:first-child { font-weight: bold; white-space: nowrap; width: 48%; }
.inv-dtable tr td:last-child { font-weight: normal; }

/* Receiver */
.inv-receiver {
  border: 1px solid #000;
  border-top: none;
}
.inv-receiver-title {
  font-weight: bold;
  font-size: 10px;
  padding: 3px 8px;
  background: #f0f0f0;
  border-bottom: 1px solid #000;
}
.inv-receiver-body {
  padding: 5px 8px;
}
.inv-rgrid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 10px;
  font-size: 9.5px;
}
.inv-rgrid .lbl { font-weight: bold; white-space: nowrap; }

/* Items table */
.inv-items {
  width: 100%;
  border-collapse: collapse;
  font-size: 9.5px;
}
.inv-items th, .inv-items td {
  border: 1px solid #000;
  padding: 3px 5px;
  text-align: center;
  vertical-align: middle;
}
.inv-items th {
  background: #f5f5f5;
  font-weight: bold;
  font-size: 9px;
  line-height: 1.3;
}
.inv-items td.al { text-align: left; }
.inv-items td.ar { text-align: right; }
.inv-items tfoot td { font-weight: bold; background: #fafafa; }

/* Bottom section */
.inv-bottom {
  border: 1px solid #000;
  border-top: none;
  display: grid;
  grid-template-columns: 55% 45%;
}
.inv-words-bank {
  padding: 7px 10px;
  border-right: 1px solid #000;
  font-size: 9.5px;
}
.inv-words-label { font-weight: bold; font-size: 10px; }
.inv-words-text { font-style: italic; margin-top: 2px; font-size: 9px; }

.inv-bank-title { font-weight: bold; font-size: 9.5px; margin-top: 8px; margin-bottom: 4px; }
.inv-bgrid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 6px;
  font-size: 9px;
}
.inv-bgrid .lbl { font-weight: bold; }

.inv-summary {
  padding: 7px 10px;
  font-size: 9.5px;
}
.inv-stbl { width: 100%; border-collapse: collapse; }
.inv-stbl td { padding: 2px 2px; vertical-align: middle; }
.inv-stbl td:last-child { text-align: right; font-weight: bold; white-space: nowrap; }
.inv-stbl .sep td { border-top: 1px solid #888; }
.inv-stbl .bsep td { border-top: 1.5px solid #000; font-weight: bold; font-size: 10px; }
.inv-stbl .bal td { color: #cc0000; font-weight: bold; }

/* Footer */
.inv-footer {
  border: 1px solid #000;
  border-top: none;
  display: grid;
  grid-template-columns: 55% 45%;
}
.inv-terms {
  padding: 7px 10px;
  border-right: 1px solid #000;
  font-size: 9px;
  line-height: 1.5;
}
.inv-terms-title { font-weight: bold; margin-bottom: 4px; font-size: 9.5px; }
.inv-certified { margin-top: 6px; font-style: italic; font-size: 8.5px; color: #444; }

.inv-signatory {
  padding: 7px 10px;
  text-align: right;
  font-size: 9.5px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.inv-sig-co { font-weight: bold; font-size: 10px; }
.inv-sig-space { height: 38px; }
.inv-sig-label { font-size: 9px; color: #444; }
.inv-thanks { font-size: 8.5px; color: #666; margin-top: 3px; }

.inv-type-badge {
  text-align: center;
  font-weight: bold;
  font-size: 11px;
  padding: 5px;
  border: 1px solid #000;
  border-top: none;
  background: #f5f5f5;
  letter-spacing: 1px;
}

/* ═══════════════════════════════════════════════════
   PRINT
═══════════════════════════════════════════════════ */
@media print {
  html, body { height: auto !important; overflow: visible !important; background: white !important; }
  .topbar, .editor { display: none !important; }
  .main { display: block !important; overflow: visible !important; height: auto !important; }
  .preview-panel {
    display: block !important;
    background: white !important;
    padding: 0 !important;
    overflow: visible !important;
    height: auto !important;
  }
  .invoice {
    box-shadow: none !important;
    width: 100% !important;
    min-height: unset !important;
    padding: 8px !important;
  }
  @page { margin: 10mm; size: A4; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-icon">📄</div>
    <div>
      <div class="topbar-title">Invoice Builder</div>
      <div class="topbar-sub">Jay Mahakali Earth Movers · Live Preview</div>
    </div>
  </div>
  <div class="btn-group">
    <button class="btn btn-print" onclick="window.print()">🖨 Print / PDF</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">⬇ Save PDF</button>
    <button class="btn btn-excel" onclick="downloadExcel()">📊 Export Excel</button>
  </div>
</div>

<div class="main">

  <!-- ═══ EDITOR PANEL ═══ -->
  <div class="editor" id="editor">

    <!-- Seller -->
    <div class="section">
      <div class="section-header" onclick="toggleSec(this)">
        🏢 Seller / Company <span class="section-arrow open">▶</span>
      </div>
      <div class="section-body">
        <div class="field"><label>Company Name</label>
          <input id="sName" type="text" oninput="render()">
        </div>
        <div class="field"><label>Address</label>
          <textarea id="sAddr" oninput="render()"></textarea>
        </div>
        <div class="g2">
          <div class="field"><label>Phone</label><input id="sPhone" oninput="render()"></div>
          <div class="field"><label>State Code</label><input id="sSC" oninput="render()"></div>
        </div>
        <div class="g2">
          <div class="field"><label>GSTIN</label><input id="sGstin" oninput="render()"></div>
          <div class="field"><label>PAN</label><input id="sPan" oninput="render()"></div>
        </div>
      </div>
    </div>

    <!-- Invoice Details -->
    <div class="section">
      <div class="section-header" onclick="toggleSec(this)">
        📋 Invoice Details <span class="section-arrow open">▶</span>
      </div>
      <div class="section-body">
        <div class="g2">
          <div class="field"><label>Invoice No.</label><input id="iNum" oninput="render()"></div>
          <div class="field"><label>Invoice Date</label><input id="iDate" oninput="render()"></div>
        </div>
        <div class="g2">
          <div class="field"><label>State</label><input id="iState" oninput="render()"></div>
          <div class="field"><label>Reverse Charge</label>
            <select id="iRC" onchange="render()"><option>NO</option><option>YES</option></select>
          </div>
        </div>
        <div class="field"><label>Vehicle Number</label><input id="iVeh" oninput="render()"></div>
      </div>
    </div>

    <!-- Buyer -->
    <div class="section">
      <div class="section-header" onclick="toggleSec(this)">
        👤 Buyer / Receiver <span class="section-arrow open">▶</span>
      </div>
      <div class="section-body">
        <div class="field"><label>Buyer Name</label><input id="bName" oninput="render()"></div>
        <div class="field"><label>Address</label><textarea id="bAddr" oninput="render()"></textarea></div>
        <div class="g2">
          <div class="field"><label>GSTIN</label><input id="bGstin" oninput="render()"></div>
          <div class="field"><label>State Code</label><input id="bSC" oninput="render()"></div>
        </div>
        <div class="field"><label>State</label><input id="bState" oninput="render()"></div>
      </div>
    </div>

    <!-- Items -->
    <div class="section">
      <div class="section-header" onclick="toggleSec(this)">
        📦 Items <span class="section-arrow open">▶</span>
      </div>
      <div class="section-body">
        <div id="itemsList"></div>
        <button class="btn-add-item" onclick="addItem()">＋ Add Item</button>
      </div>
    </div>

    <!-- Live Totals -->
    <div class="section">
      <div class="section-header" onclick="toggleSec(this)">
        🧮 Live Totals <span class="section-arrow open">▶</span>
      </div>
      <div class="section-body">
        <div class="totals-strip">
          <div class="t-row"><span>Taxable Amount</span><span id="tTaxable">₹ 0.00</span></div>
          <div class="t-row"><span>CGST</span><span id="tCgst">₹ 0.00</span></div>
          <div class="t-row"><span>SGST</span><span id="tSgst">₹ 0.00</span></div>
          <div class="t-row"><span>Total Tax</span><span id="tTax">₹ 0.00</span></div>
          <div class="t-row final"><span>Final Amount</span><span id="tFinal">₹ 0.00</span></div>
          <div class="t-row balance"><span>Balance Due</span><span id="tBal">₹ 0.00</span></div>
        </div>
        <div class="field">
          <label>Amount Paid (₹)</label>
          <input id="amtPaid" type="number" value="0" min="0" oninput="render()">
        </div>
      </div>
    </div>

    <!-- Bank -->
    <div class="section">
      <div class="section-header" onclick="toggleSec(this)">
        🏦 Bank Details <span class="section-arrow open">▶</span>
      </div>
      <div class="section-body">
        <div class="field"><label>Account Name</label><input id="bkAccName" oninput="render()"></div>
        <div class="field"><label>Account Number</label><input id="bkAccNo" oninput="render()"></div>
        <div class="g2">
          <div class="field"><label>IFSC Code</label><input id="bkIfsc" oninput="render()"></div>
          <div class="field"><label>Swift Code</label><input id="bkSwift" oninput="render()"></div>
        </div>
        <div class="g2">
          <div class="field"><label>Bank Name</label><input id="bkBank" oninput="render()"></div>
          <div class="field"><label>Branch</label><input id="bkBranch" oninput="render()"></div>
        </div>
      </div>
    </div>

    <!-- Terms -->
    <div class="section">
      <div class="section-header" onclick="toggleSec(this)">
        📜 Terms & Conditions <span class="section-arrow open">▶</span>
      </div>
      <div class="section-body">
        <div class="field">
          <label>One term per line</label>
          <textarea id="terms" rows="4" oninput="render()"></textarea>
        </div>
      </div>
    </div>

  </div><!-- /editor -->

  <!-- ═══ PREVIEW PANEL ═══ -->
  <div class="preview-panel">
    <div class="invoice" id="invoice"><!-- rendered by JS --></div>
  </div>

</div><!-- /main -->

<script>
// ══════════════════════════════════════════════════════════
//  DATA MODEL
// ══════════════════════════════════════════════════════════
const D = {
  seller: {
    name:      'JAY MAHAKALI EARTH MOVERS',
    address:   'GOLIBAR MALAV ROAD KALOL, Panchmahals, Gujarat, 389330',
    phone:     '9825468621',
    gstin:     '24AHHPV8596L1ZB',
    stateCode: '24',
    pan:       'AHHPV8596L'
  },
  inv: {
    number: '33',
    date:   '11-03-2026',
    state:  'Gujarat',
    rc:     'NO',
    vehicle:'GJ17UU5671'
  },
  buyer: {
    name:      'JALARAM TRADERS',
    address:   '1 GODHRA ROAD TA. HALOL, Panchmahals, Gujarat, 389350',
    gstin:     '24ACMPG4527E1ZV',
    stateCode: '24',
    state:     'Gujarat'
  },
  items: [
    { name:'Sand', desc:'Sand', qty:35, unit:'TON', rate:1000, cgst:2.5, sgst:2.5 }
  ],
  bank: {
    accName:'Jay Mahakali Earth Movers',
    accNo:  '50200027797355',
    ifsc:   'HDFC0000954',
    bank:   'HDFC Bank',
    branch: 'HALOL BRANCH',
    swift:  'HDFCINBB'
  },
  terms: [
    'This is an electronically generated document.',
    'All disputes are subject to Panchmahals jurisdiction.'
  ],
  paid: 0
};

// ══════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════
function initForm() {
  const s = D.seller; const iv = D.inv; const b = D.buyer; const bk = D.bank;
  set('sName',  s.name);    set('sAddr', s.address); set('sPhone', s.phone);
  set('sGstin', s.gstin);   set('sSC',   s.stateCode); set('sPan', s.pan);
  set('iNum',   iv.number); set('iDate', iv.date);   set('iState', iv.state);
  document.getElementById('iRC').value = iv.rc;
  set('iVeh',   iv.vehicle);
  set('bName',  b.name);    set('bAddr', b.address); set('bGstin', b.gstin);
  set('bSC',    b.stateCode); set('bState', b.state);
  set('bkAccName', bk.accName); set('bkAccNo', bk.accNo);
  set('bkIfsc', bk.ifsc);   set('bkSwift', bk.swift);
  set('bkBank', bk.bank);   set('bkBranch', bk.branch);
  set('terms',  D.terms.join('\n'));
  set('amtPaid', D.paid);
  renderItemsList();
  render();
}
function set(id, val) { document.getElementById(id).value = val; }

// ══════════════════════════════════════════════════════════
//  COLLECT FORM DATA
// ══════════════════════════════════════════════════════════
function collect() {
  const g = id => document.getElementById(id).value;
  D.seller.name      = g('sName');
  D.seller.address   = g('sAddr');
  D.seller.phone     = g('sPhone');
  D.seller.gstin     = g('sGstin');
  D.seller.stateCode = g('sSC');

// ══════════════════════════════════════════════════════════
//  CALCULATIONS
// ══════════════════════════════════════════════════════════
function calcItem(it) {
  const taxable = it.qty * it.rate;
  const cgstAmt = taxable * it.cgst / 100;
  const sgstAmt = taxable * it.sgst / 100;
  return { taxable, cgstAmt, sgstAmt, total: taxable + cgstAmt + sgstAmt };
}

function calcTotals() {
  let taxable=0, cgst=0, sgst=0, qty=0;
  D.items.forEach(it => {
    const c = calcItem(it);
    taxable += c.taxable; cgst += c.cgstAmt; sgst += c.sgstAmt; qty += Number(it.qty);
  });
  const tax   = cgst + sgst;
  const final = taxable + tax;
  const bal   = final - D.paid;
  return { qty, taxable, cgst, sgst, tax, final, bal };
}

function fmt(n) {
  return Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}

// ══════════════════════════════════════════════════════════
//  NUMBER TO WORDS (Indian system)
// ══════════════════════════════════════════════════════════
function n2w(num) {
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens_=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function h(n){
    n=Math.floor(n);
    if(!n) return '';
    if(n<20)  return ones[n];
    if(n<100) return tens_[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
    if(n<1000)return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+h(n%100):'');
    if(n<1e5) return h(Math.floor(n/1000))+' Thousand'+(n%1000?' '+h(n%1000):'');
    if(n<1e7) return h(Math.floor(n/1e5))+' Lakh'+(n%1e5?' '+h(n%1e5):'');
    return h(Math.floor(n/1e7))+' Crore'+(n%1e7?' '+h(n%1e7):'');
  }
  const integer = Math.floor(num);
  const paise   = Math.round((num - integer)*100);
  let w = h(integer)||'Zero';
  if(paise>0) w += ' and '+h(paise)+' Paise';
  return w+' Rupees Only /-';
}

function toggleSec(hdr) {
  const body  = hdr.nextElementSibling;
  const arrow = hdr.querySelector('.section-arrow');
  if(body.style.display === 'none') {
    body.style.display = 'flex';
    arrow.classList.add('open');
  } else {
    body.style.display = 'none';
    arrow.classList.remove('open');
  }
}
